<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Sinced social preview</title>
<style>
@font-face{font-family:Allo;src:url(../assets/fonts/Allo-Regular.otf);font-weight:400}
@font-face{font-family:Allo;src:url(../assets/fonts/Allo-Medium.otf);font-weight:500}
@font-face{font-family:Allo;src:url(../assets/fonts/Allo-SemiBold.otf);font-weight:600}
@font-face{font-family:Allo;src:url(../assets/fonts/Allo-Bold.otf);font-weight:700}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#F6F5F1;color:#141417;font-family:Allo,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;position:relative}

.glow{position:absolute;left:560px;top:-140px;width:760px;height:900px;filter:blur(70px);opacity:.6;
  background:radial-gradient(closest-side at 40% 30%,#FA96A1,transparent),radial-gradient(closest-side at 70% 34%,#FFC59E,transparent),
  radial-gradient(closest-side at 38% 62%,#BDD47E,transparent),radial-gradient(closest-side at 72% 66%,#C09CF9,transparent)}

.copy{position:absolute;left:84px;top:0;bottom:0;width:600px;display:flex;flex-direction:column;justify-content:center}
.app{display:flex;align-items:center;gap:16px}
.app img{width:72px;height:72px;border-radius:17px;box-shadow:0 14px 30px -14px rgba(20,20,23,.45)}
.app b{font-size:30px;font-weight:600;letter-spacing:-.02em;display:block}
.app span{font-size:19px;color:#6E6E73}
h1{font-size:88px;line-height:.95;letter-spacing:-.045em;font-weight:700;margin-top:40px}
p{font-size:26px;line-height:1.35;color:#6E6E73;margin-top:24px}
.url{position:absolute;left:84px;bottom:44px;font-size:18px;font-weight:500;color:#6E6E73;display:flex;align-items:center;gap:10px}
.url i{width:8px;height:8px;border-radius:50%;background:#488B5A}

/* the phone: real home screen, bleeding off the bottom edge */
.phone{position:absolute;left:var(--px);top:var(--py);width:var(--pw);aspect-ratio:1320/2868;border-radius:50px;overflow:hidden;
  box-shadow:0 0 0 7px #141417,0 0 0 8px #3a3a3e,0 50px 90px -30px rgba(20,20,23,.55)}
.phone img{width:100%;height:100%;display:block}
.phone::after{content:"";position:absolute;inset:0;background:rgba(20,20,23,.32)}

/* widgets lifted out of the same screenshot */
.pop{position:absolute;background-image:url(home.png);background-repeat:no-repeat;
  box-shadow:0 0 0 1px rgba(255,255,255,.35),0 34px 60px -22px rgba(20,20,23,.6),0 12px 24px -12px rgba(20,20,23,.35)}
</style>
</head>
<body>
<div class="glow"></div>

<div class="copy">
  <div class="app">
    <img src="../assets/sinced-icon.png" alt="">
    <div><b>sinced</b><span>days since counter for iPhone</span></div>
  </div>
  <h1>how long<br>has it been?</h1>
  <p>your streaks, right on your home screen.<br>no account. no cloud.</p>
</div>
<div class="url"><i></i>adityakolte.com/sinced</div>

<div class="phone" id="phone"><img src="home.png" alt=""></div>

<!-- crop boxes in the 1320 × 2868 screenshot: x, y, width, height, corner radius, lift, tilt -->
<div class="pop" data-crop="94,282,1132,530,92,1.2,-3"></div>

<script>
// Phone placement on the 1200 × 630 canvas
const P = { x: 772, y: 70, w: 340 }
const s = P.w / 1320
const root = document.documentElement.style
root.setProperty('--px', P.x + 'px'); root.setProperty('--py', P.y + 'px'); root.setProperty('--pw', P.w + 'px')

// Each pop-out shows the same pixels as its widget, scaled up by `lift` and centred on the original spot
for (const el of document.querySelectorAll('.pop')) {
  const [x, y, w, h, r, lift, tilt] = el.dataset.crop.split(',').map(Number)
  const k = s * lift
  Object.assign(el.style, {
    width: w * k + 'px', height: h * k + 'px', borderRadius: r * k + 'px',
    backgroundSize: 1320 * k + 'px auto', backgroundPosition: `${-x * k}px ${-y * k}px`,
    left: P.x + (x + w / 2) * s + 'px', top: P.y + (y + h / 2) * s + 'px',
    transform: `translate(-50%,-50%) rotate(${tilt}deg)`,
  })
}
</script>
</body>
</html>
